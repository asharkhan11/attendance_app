server {
    listen 80;
    listen [::]:80;

    server_name attendance.mooble.win;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name attendance.mooble.win;

    ssl_certificate     /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/attendance;
    index index.html;

    # --------------------------------------------------
    # Compression
    # --------------------------------------------------

    gzip on;
    gzip_static on;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        application/wasm;

    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;

    # --------------------------------------------------
    # Security headers
    # --------------------------------------------------

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------
    # Flutter entry point & dynamic bootstrap scripts
    # NEVER cache index.html, bootstrap JS, service worker, or app code
    # --------------------------------------------------

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ~* (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|main\.dart\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # --------------------------------------------------
    # Static Flutter assets (canvaskit, fonts, images)
    # --------------------------------------------------

    location ~* \.(js|css|wasm|png|jpg|jpeg|gif|ico|svg|webp|ttf|woff|woff2|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --------------------------------------------------
    # Flutter routing
    # --------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------
    # Error handling
    # --------------------------------------------------

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        internal;
    }
}
